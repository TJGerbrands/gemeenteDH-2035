<h1>Stadhuis van 2035</h1>

<p>Welkom in de Gemeente van 2035.</p>

<h2>Wat is dit?</h2>

<p>
Tijdens dit festival bouwen bezoekers samen aan een toekomstgemeente.
Elk gebouw, kunstwerk, park of object vertegenwoordigt een idee.
</p>

<h2>Verken de stad</h2>

<p>
Klik op gebouwen en objecten om de ideeën van andere bezoekers te ontdekken.
</p>
